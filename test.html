<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая оплата WayForPay</title>
    <!-- 1. Скрипт WayForPay -->
    <script id="widget-wfp-script" type="text/javascript" src="https://secure.wayforpay.com/server/pay-widget.js"></script>
    <!-- 2. Библиотека Crypto-JS для HMAC MD5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; }
        .pay-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; }
        .pay-btn { background-color: #2b7fff; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .pay-btn:hover { background-color: #1a65d6; }
    </style>
</head>
<body>

<div class="pay-card">
    <h2>Тестовый доступ</h2>
    <p>Цена: <b>1.00 UAH</b></p>
    <button class="pay-btn" onclick="pay();">Оплатить доступ</button>
</div>

<script type="text/javascript">
    var RAILWAY_DOMAIN = "servicepayment-production.up.railway.app"; // Замените на ваш домен Railway

    function pay() {
        var orderId = "ORDER_" + Date.now();
        var orderDate = Math.floor(Date.now() / 1000).toString();
        var merchantAccount = "test_merch_n1";
        // Официальный тестовый SecretKey
        var secretKey = "flk3409refn54t54t*FNJRET"; 
        
        var amount = "1";
        var currency = "UAH";
        var productName = ["Тестовый доступ в бот"];
        var productPrice = ["1"];
        var productCount = ["1"];

        // Собираем элементы строки согласно протоколу WayForPay
        var signParams = [
            merchantAccount,
            RAILWAY_DOMAIN,
            orderId,
            orderDate,
            amount,
            currency
        ];

        // Добавляем продуктовые массивы поочередно
        for (var i = 0; i < productName.length; i++) {
            signParams.push(productName[i]);
        }
        for (var i = 0; i < productCount.length; i++) {
            signParams.push(productCount[i]);
        }
        for (var i = 0; i < productPrice.length; i++) {
            signParams.push(productPrice[i]);
        }

        var signString = signParams.join(";");
        
        // Генерация подписи HMAC MD5
        var signature = CryptoJS.HmacMD5(signString, secretKey).toString();

        var wayforpay = new Wayforpay();
        wayforpay.run({
                merchantAccount: merchantAccount,
                merchantDomainName: RAILWAY_DOMAIN,
                authorizationType: "SimpleSignature",
                merchantSignature: signature,
                orderReference: orderId,
                orderDate: orderDate,
                amount: amount,
                currency: currency,
                productName: productName,
                productPrice: productPrice,
                productCount: productCount,
                serviceUrl: "https://" + RAILWAY_DOMAIN + "/webhook/wayforpay",
                returnUrl: "https://" + RAILWAY_DOMAIN + "/success-page/" + orderId
            },
            // function (response) { console.log("Успешная оплата:", response); },
            function (response) {
                console.log("Успешная оплата:", response);
                // Редиректим пользователя на страницу успешной оплаты на бэкенде
                window.location.href = "https://" + RAILWAY_DOMAIN + "/success-page/" + orderId;
                console.log("https://" + RAILWAY_DOMAIN + "/success-page/" + orderId);
            },
            function (response) { console.log("Оплата отклонена:", response); },
            function (response) { console.log("Окно закрыто:", response); }
            
        );
    }
</script>

</body>
</html>
